services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: staff_attendance
      DB_USER: staff_user
      DB_PASS: staff_pass
      APP_TIMEZONE: UTC
      APP_SECURE_COOKIES: "0"
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: staff_attendance
      MYSQL_USER: staff_user
      MYSQL_PASSWORD: staff_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped
volumes:
  db_data:
